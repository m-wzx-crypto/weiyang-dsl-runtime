env GATEWAY_HTTPS_PORT;
env SSL_TERMINATED_UPSTREAM;
env EXTERNAL_HTTPS_PORT;
env X_INTERNAL_SECRET;
env JWT_SECRET;
env REDIS_HOST;
env REDIS_PORT;
env REDIS_PASSWORD;
env LOG_API_URL;
env LOG_API_SECRET;
env BIZ_GRPC_HOST;
env BIZ_GRPC_PORT;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

worker_rlimit_nofile 65535;

# B9: 优雅关闭 worker 的最大等待时长,避免旧 worker 长时间挂起占用资源
worker_shutdown_timeout 30s;

events {
    use epoll;
    worker_connections 10240;
}

http {
    resolver 127.0.0.11 valid=10s ipv6=off;
    include       mime.types;
    default_type  application/json;

    server_tokens off;
    client_max_body_size 50m;

    proxy_buffer_size 16k;
    proxy_buffers 4 16k;
    client_body_buffer_size 256k;

    proxy_next_upstream error timeout http_502 http_503 http_504;

    tcp_nodelay on;
    tcp_nopush on;
    reset_timedout_connection on;

    # B1: 检测客户端主动断开,及时终止上游请求,避免浪费后端资源
    lua_check_client_abort on;

    # I8: 限流命中时返回 429 (Too Many Requests) 而非默认 503,语义更准确
    limit_req_status 429;
    limit_conn_status 429;

    lua_package_path "/usr/local/openresty/nginx/lua/?.lua;;";

    lua_shared_dict jwt_blacklist 10m;
    lua_shared_dict tenant_limit 50m;
    lua_shared_dict global_limit 10m;
    lua_shared_dict ip_blacklist 20m;
    lua_shared_dict user_limit 20m;
    lua_shared_dict tenant_quota 5m;
    lua_shared_dict api_rate_limit 20m;

    lua_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;

    log_format detailed_log '$remote_addr - [$time_local] '
                            '"$request" $status $body_bytes_sent '
                            '"$http_referer" "$http_user_agent" '
                            'request_time=$request_time '
                            'upstream_response_time=$upstream_response_time '
                            'tenant_id=$http_x_auth_tenant_id '
                            'user_id=$http_x_auth_user_id';

    access_log /var/log/nginx/access.log detailed_log;
    error_log  /var/log/nginx/error.log warn;

    limit_req_zone $binary_remote_addr zone=global_req_limit:20m rate=100r/s;
    limit_conn_zone $binary_remote_addr zone=global_conn_limit:20m;

    upstream bff_upstream {
        server bff:3000 max_fails=2 fail_timeout=10s;
        keepalive 128;
    }

    upstream biz_upstream {
        server biz:8080 max_fails=2 fail_timeout=10s;
        keepalive 128;
    }

    upstream ai_upstream {
        server ai:8000 max_fails=2 fail_timeout=10s;
        keepalive 128;
    }

    upstream minio_upstream {
        server minio:9000 max_fails=2 fail_timeout=10s;
        keepalive 32;
    }

    gzip on;
    gzip_static on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 256;

    # S7: 启动时校验关键密钥非空,缺失则拒绝启动 (fail-closed)
    init_by_lua_block {
        local internal_secret = os.getenv("X_INTERNAL_SECRET")
        if not internal_secret or internal_secret == "" then
            ngx.log(ngx.EMERG, "X_INTERNAL_SECRET environment variable is required and must be non-empty")
            error("X_INTERNAL_SECRET environment variable is required and must be non-empty")
        end
    }

    init_worker_by_lua_block {
        local sync_data

        local function sync_ip_blacklist(premature)
            if premature then return end
            local ok, dict = pcall(function()
                return ngx.shared.ip_blacklist
            end)
            if not ok or not dict then return end

            local redis_host = os.getenv("REDIS_HOST") or "redis"
            local redis_port = tonumber(os.getenv("REDIS_PORT")) or 6379
            local redis_password = os.getenv("REDIS_PASSWORD") or ""

            local redis = require "resty.redis"
            local red = redis:new()
            red:set_timeouts(1000, 1000, 1000)

            local ok2, err = red:connect(redis_host, redis_port)
            if not ok2 then
                ngx.log(ngx.ERR, "failed to connect to redis for ip blacklist sync: ", err)
                return
            end

            if redis_password and redis_password ~= "" then
                local ok3, err = red:auth(redis_password)
                if not ok3 then
                    ngx.log(ngx.ERR, "failed to auth redis: ", err)
                    return
                end
            end

            local ips, err = red:smembers("gateway:ip_blacklist")
            if err then
                ngx.log(ngx.ERR, "failed to get ip blacklist from redis: ", err)
            else
                -- S6: 采用"先 set 新值再 delete 旧值"策略,避免 flush_all 后到新值写入前
                -- 出现 IP 黑名单放行窗口。先收集新键集合,再写入,最后删除不在新集合中的旧键。
                local cjson = require "cjson.safe"
                local new_keys = {}
                for _, ip_entry in ipairs(ips) do
                    local entry = cjson.decode(ip_entry)
                    if entry then
                        local ttl = entry.expire_at - ngx.time()
                        if ttl > 0 then
                            dict:set(entry.ip, "1", ttl)
                            new_keys[entry.ip] = true
                        end
                    else
                        dict:set(ip_entry, "1")
                        new_keys[ip_entry] = true
                    end
                end

                -- 删除不在新集合中的旧 key,完成原子切换
                local all_keys = dict:get_keys(0)
                for _, old_key in ipairs(all_keys) do
                    if not new_keys[old_key] then
                        dict:delete(old_key)
                    end
                end
                dict:flush_expired()
            end

            local ok4, err = red:set_keepalive(10000, 100)
            if not ok4 then
                ngx.log(ngx.ERR, "failed to set redis keepalive: ", err)
            end
        end

        local function sync_tenant_quota(premature)
            if premature then return end
            local ok, dict = pcall(function()
                return ngx.shared.tenant_quota
            end)
            if not ok or not dict then return end

            local redis_host = os.getenv("REDIS_HOST") or "redis"
            local redis_port = tonumber(os.getenv("REDIS_PORT")) or 6379
            local redis_password = os.getenv("REDIS_PASSWORD") or ""

            local redis = require "resty.redis"
            local red = redis:new()
            red:set_timeouts(1000, 1000, 1000)

            local ok2, err = red:connect(redis_host, redis_port)
            if not ok2 then
                ngx.log(ngx.ERR, "failed to connect to redis for tenant quota sync: ", err)
                return
            end

            if redis_password and redis_password ~= "" then
                local ok3, err = red:auth(redis_password)
                if not ok3 then
                    ngx.log(ngx.ERR, "failed to auth redis: ", err)
                    return
                end
            end

            -- 使用 SCAN 替代 KEYS，避免阻塞 Redis
            local cursor = "0"
            repeat
                local res, err = red:scan(cursor, "MATCH", "gateway:tenant_quota:*", "COUNT", 100)
                if err then
                    ngx.log(ngx.ERR, "failed to scan tenant quota keys from redis: ", err)
                    break
                end
                cursor = res[1]
                local keys = res[2]
                for _, key in ipairs(keys) do
                    local tier, err2 = red:get(key)
                    if not err2 and tier then
                        local tenant_id = key:gsub("gateway:tenant_quota:", "")
                        dict:set(tenant_id, tier, 0)
                    end
                end
            until cursor == "0"

            local ok4, err = red:set_keepalive(10000, 100)
            if not ok4 then
                ngx.log(ngx.ERR, "failed to set redis keepalive: ", err)
            end
        end

        local function sync_all(premature)
            sync_ip_blacklist(premature)
            sync_tenant_quota(premature)
        end

        local ok, err = ngx.timer.at(0, sync_all)
        if not ok then
            ngx.log(ngx.ERR, "failed to run initial full sync: ", err)
        end

        local ok2, err2 = ngx.timer.every(10, sync_all)
        if not ok2 then
            ngx.log(ngx.ERR, "failed to start sync timer: ", err2)
        end
    }

    server {
        listen 80;
        server_name _;

        limit_req zone=global_req_limit burst=50 nodelay;
        limit_conn global_conn_limit 100;

        location /health {
            access_log off;
            default_type application/json;
            return 200 '{"status":"ok","service":"gateway"}';
        }

        # S2: 80 端口除 /health 和 /api/bff/version (版本检查可公开) 外,
        # 全部强制重定向到 HTTPS。原 /api/bff/download/ 与 version/download
        # 已删除,避免绕过 SSL 与鉴权直接下载文件。

        location / {
            content_by_lua_block {
                local ssl_terminated = os.getenv("SSL_TERMINATED_UPSTREAM") or "false"
                local forwarded_proto = ngx.var.http_x_forwarded_proto

                if ssl_terminated == "true" or (forwarded_proto and forwarded_proto == "https") then
                    ngx.exec("@backend")
                else
                    local external_port = os.getenv("EXTERNAL_HTTPS_PORT") or "443"
                    local redirect_url
                    if external_port == "443" then
                        redirect_url = "https://" .. ngx.var.host .. ngx.var.request_uri
                    else
                        redirect_url = "https://" .. ngx.var.host .. ":" .. external_port .. ngx.var.request_uri
                    end
                    return ngx.redirect(redirect_url, 301)
                end
            }
        }

        location @backend {
            access_by_lua_block {
                local auth = require "auth"
                auth.verify_jwt()

                local tenant_limit_mod = require "tenant_limit"
                tenant_limit_mod.check()

                local user_limit_mod = require "user_limit"
                user_limit_mod.check()

                local ip_bl = require "ip_blacklist"
                ip_bl.check()
            }

            # S7: X_INTERNAL_SECRET 已在 init_by_lua_block 校验非空,此处不再回退空字符串
            set_by_lua_block $x_internal_secret {
                return os.getenv("X_INTERNAL_SECRET")
            }

            proxy_pass http://bff_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Internal-Secret $x_internal_secret;
            proxy_read_timeout 60s;
            proxy_connect_timeout 10s;
            proxy_send_timeout 30s;
        }
    }

    server {
        listen 443 ssl;
        server_name _;

        # S7: X_INTERNAL_SECRET 已在 init_by_lua_block 校验非空,此处不再回退空字符串
        set_by_lua_block $x_internal_secret {
            return os.getenv("X_INTERNAL_SECRET")
        }

        ssl_certificate     /certs/fullchain.pem;
        ssl_certificate_key /certs/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers on;
        ssl_session_cache   shared:SSL:20m;
        ssl_session_timeout 10m;

        # I14: 启用 OCSP Stapling,提升 TLS 握手效率与隐私;关闭 session tickets 避免 forward secrecy 风险
        ssl_stapling on;
        ssl_stapling_verify on;
        ssl_session_tickets off;

        # S5: HSTS 强制浏览器后续访问使用 HTTPS,防止 SSL 剥离攻击
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        # I7: TODO CSP 中 unsafe-inline 需前端配合 nonce/csp 替换后才能移除,工作量大暂不处理
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self'" always;

        limit_req zone=global_req_limit burst=50 nodelay;
        limit_conn global_conn_limit 100;

        location /gateway/health {
            access_log off;
            default_type application/json;
            content_by_lua_block {
                ngx.say('{"status":"ok","timestamp":' .. ngx.time() .. '}')
            }
        }

        location = /api/bff/version/check {
            proxy_pass http://bff_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
            proxy_connect_timeout 10s;
            proxy_send_timeout 30s;
        }

        location /api/bff/ws {
            access_by_lua_block {
                -- WebSocket 连接无法设置 HTTP 头,从 query string 中提取 token 注入到 X-Auth-Token 头
                local args = ngx.req.get_uri_args()
                if args and args.token and not ngx.var.http_x_auth_token then
                    ngx.req.set_header("X-Auth-Token", args.token)
                end

                local auth = require "auth"
                auth.verify_jwt()

                local tenant_limit_mod = require "tenant_limit"
                tenant_limit_mod.check()

                local user_limit_mod = require "user_limit"
                user_limit_mod.check()

                local ip_bl = require "ip_blacklist"
                ip_bl.check()
            }

            proxy_pass http://bff_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Internal-Secret $x_internal_secret;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 3600s;
            proxy_connect_timeout 10s;
            proxy_send_timeout 30s;
        }

        location /api/bff/download/ {
            proxy_pass http://bff_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        location ~ ^/api/bff/version/download/([^/]+\.(apk|wgt))$ {
            alias /apk/$1;
            add_header Content-Disposition 'attachment; filename="$1"';
            add_header X-Frame-Options DENY always;
            add_header X-Content-Type-Options nosniff always;
            add_header Accept-Ranges bytes;
            types {
                application/vnd.android.package-archive apk;
                application/octet-stream wgt;
            }
            default_type application/octet-stream;
        }

        location /api/bff/ai/ {
            access_by_lua_block {
                local auth = require "auth"
                auth.verify_jwt()

                local tenant_limit_mod = require "tenant_limit"
                tenant_limit_mod.check()

                local user_limit_mod = require "user_limit"
                user_limit_mod.check()

                local ip_bl = require "ip_blacklist"
                ip_bl.check()
            }

            proxy_pass http://bff_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection '';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Internal-Secret $x_internal_secret;
            # I11: 移除 X-Tenant-Id 透传,统一由 auth.lua 设置 X-Auth-Tenant-Id
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding on;
            proxy_read_timeout 180s;
            proxy_connect_timeout 10s;
            proxy_send_timeout 30s;
        }

        location /api/bff/ {
            access_by_lua_block {
                local auth = require "auth"
                auth.verify_jwt()

                local tenant_limit_mod = require "tenant_limit"
                tenant_limit_mod.check()

                local user_limit_mod = require "user_limit"
                user_limit_mod.check()

                local ip_bl = require "ip_blacklist"
                ip_bl.check()
            }

            proxy_pass http://bff_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Internal-Secret $x_internal_secret;
            # I11: 移除 X-Tenant-Id 透传,统一由 auth.lua 设置 X-Auth-Tenant-Id
            proxy_read_timeout 60s;
            proxy_connect_timeout 10s;
            proxy_send_timeout 30s;
        }

        location /api/biz/ {
            access_by_lua_block {
                local auth = require "auth"
                auth.verify_jwt()

                local tenant_limit_mod = require "tenant_limit"
                tenant_limit_mod.check()

                local user_limit_mod = require "user_limit"
                user_limit_mod.check()

                local ip_bl = require "ip_blacklist"
                ip_bl.check()
            }

            proxy_pass http://biz_upstream/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Internal-Secret $x_internal_secret;
            proxy_read_timeout 60s;
            proxy_connect_timeout 10s;
            proxy_send_timeout 30s;
        }

        location /api/ai/ {
            access_by_lua_block {
                local auth = require "auth"
                auth.verify_jwt()

                local tenant_limit_mod = require "tenant_limit"
                tenant_limit_mod.check()

                local user_limit_mod = require "user_limit"
                user_limit_mod.check()

                local ip_bl = require "ip_blacklist"
                ip_bl.check()
            }

            proxy_pass http://ai_upstream/;
            proxy_http_version 1.1;
            proxy_set_header Connection '';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Internal-Secret $x_internal_secret;
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding on;
            proxy_read_timeout 180s;
            proxy_connect_timeout 10s;
            proxy_send_timeout 30s;
        }

        location /api/open/ {
            access_by_lua_block {
                local open_auth = require "open_auth"
                open_auth.verify()

                local tenant_limit_mod = require "tenant_limit"
                tenant_limit_mod.check()

                local ip_bl = require "ip_blacklist"
                ip_bl.check()
            }

            proxy_pass http://biz_upstream/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Api-Key-Scopes $http_x_api_key_scopes;
            proxy_set_header X-Internal-Secret $x_internal_secret;
            proxy_read_timeout 30s;
            proxy_connect_timeout 5s;
            proxy_send_timeout 15s;
        }

        # MinIO 预签名 URL 代理：前端 <image src> 需要直接访问预签名 URL。
        # 安全性由 MinIO 预签名 URL 的 HMAC 签名 + 过期时间保证，无签名的请求会被 MinIO 返回 403。
        # 不使用 internal 指令，否则前端直接 GET 会返回 404 导致头像无法显示。
        location /minio/ {
            proxy_pass http://minio_upstream/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host minio:9000;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_read_timeout 60s;
            proxy_connect_timeout 10s;
            proxy_send_timeout 30s;
        }

        # MCP Server — Trae AI 运维代理
        location /mcp {
            proxy_pass http://mcp-server:8100;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_read_timeout 300s;
            proxy_connect_timeout 10s;
            proxy_send_timeout 30s;
        }

        # 邀请码 H5 页面（公开访问，无需鉴权）
        location /invite {
            alias /demo-static/invite;
            index index.html;
            try_files $uri $uri/ /invite/index.html;
        }

        log_by_lua_block {
            local log_util = require "log_util"
            log_util.log_request()
        }
    }
}
