name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dsl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: dsl/go.sum

      - name: Build
        working-directory: dsl
        run: go build ./...

      - name: Vet
        working-directory: dsl
        run: go vet ./...

      - name: Test
        working-directory: dsl
        run: go test ./... -v -timeout 60s
